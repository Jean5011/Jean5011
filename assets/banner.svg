<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Jean Pierre Esquen — Ciencia de datos y desarrollo">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="0.6" stop-color="#1a0638"/>
      <stop offset="1" stop-color="#3a0a52"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0640"/>
      <stop offset="1" stop-color="#05010f"/>
    </linearGradient>
    <linearGradient id="luna" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2fb0"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <filter id="brillo" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="brilloSuave" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="marco"><rect width="1200" height="340" rx="14"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <style>
      .t { font-family: 'DejaVu Sans Mono', 'Consolas', 'Courier New', monospace; }
      .titulo { font-size: 58px; font-weight: 700; letter-spacing: 6px; }
      .glitch-c { animation: gc 3.2s infinite steps(1); }
      .glitch-m { animation: gm 3.2s infinite steps(1); }
      @keyframes gc { 0%,88%,100% { transform: translate(-3px,0); } 90% { transform: translate(-9px,2px); } 93% { transform: translate(4px,-2px); } }
      @keyframes gm { 0%,88%,100% { transform: translate(3px,0); } 90% { transform: translate(9px,-2px); } 93% { transform: translate(-4px,2px); } }
      .parpadeo { animation: p 1s infinite steps(1); }
      @keyframes p { 50% { opacity: 0; } }
      .neon { animation: n 4s infinite; }
      @keyframes n { 0%,100% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: 0.35; } 49% { opacity: 1; } 51% { opacity: 0.5; } 52% { opacity: 1; } }
      .grilla { animation: g 1.6s linear infinite; }
      @keyframes g { from { transform: translateY(0); } to { transform: translateY(20px); } }
      .ventana { animation: v 5s infinite; }
      @keyframes v { 0%,100% { opacity: 0.9; } 50% { opacity: 0.3; } }
    </style>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1200" height="340" fill="url(#cielo)"/>

    <!-- Estrellas -->
    <g fill="#ffffff" opacity="0.6">
      <circle cx="80" cy="40" r="1"/><circle cx="210" cy="90" r="1.2"/><circle cx="330" cy="30" r="0.8"/>
      <circle cx="470" cy="70" r="1"/><circle cx="760" cy="35" r="1.1"/><circle cx="880" cy="85" r="0.9"/>
      <circle cx="1010" cy="25" r="1.2"/><circle cx="1120" cy="70" r="0.8"/><circle cx="610" cy="20" r="0.9"/>
    </g>

    <!-- Luna neón -->
    <circle cx="1050" cy="120" r="55" fill="url(#luna)" opacity="0.85" filter="url(#brillo)"/>
    <g fill="#1a0638">
      <rect x="990" y="128" width="120" height="4"/><rect x="990" y="140" width="120" height="6"/><rect x="990" y="154" width="120" height="8"/>
    </g>

    <!-- Ciudad lejana -->
    <g fill="#12042a">
      <rect x="0" y="190" width="60" height="70"/><rect x="55" y="160" width="45" height="100"/><rect x="95" y="200" width="70" height="60"/>
      <rect x="160" y="150" width="38" height="110"/><rect x="195" y="185" width="60" height="75"/><rect x="250" y="170" width="40" height="90"/>
      <rect x="1040" y="175" width="50" height="85"/><rect x="1085" y="150" width="40" height="110"/><rect x="1120" y="190" width="80" height="70"/>
    </g>
    <!-- Ciudad cercana con ventanas -->
    <g fill="#08021a">
      <rect x="20" y="215" width="70" height="45"/><rect x="110" y="185" width="50" height="75"/><rect x="220" y="205" width="55" height="55"/>
      <rect x="1060" y="200" width="60" height="60"/><rect x="1140" y="180" width="45" height="80"/>
    </g>
    <g class="ventana">
      <g fill="#00f0ff">
        <rect x="118" y="195" width="6" height="4"/><rect x="132" y="195" width="6" height="4"/><rect x="146" y="207" width="6" height="4"/>
        <rect x="118" y="219" width="6" height="4"/><rect x="230" y="215" width="6" height="4"/><rect x="258" y="227" width="6" height="4"/>
        <rect x="1150" y="192" width="6" height="4"/><rect x="1164" y="204" width="6" height="4"/>
      </g>
      <g fill="#ff2fb0">
        <rect x="30" y="225" width="6" height="4"/><rect x="58" y="225" width="6" height="4"/><rect x="132" y="231" width="6" height="4"/>
        <rect x="244" y="239" width="6" height="4"/><rect x="1070" y="212" width="6" height="4"/><rect x="1098" y="224" width="6" height="4"/>
      </g>
    </g>
    <!-- Cartel neón vertical: データ = "datos" -->
    <g class="neon">
      <rect x="62" y="118" width="26" height="86" rx="3" fill="#05010f" stroke="#00f0ff" stroke-width="1.5" filter="url(#brilloSuave)"/>
      <text x="75" y="140" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif" font-size="17" fill="#00f0ff" text-anchor="middle" filter="url(#brilloSuave)">
        <tspan x="75" dy="0">デ</tspan><tspan x="75" dy="44">タ</tspan>
      </text>
    </g>
    <rect x="74" y="148" width="2.2" height="14" fill="#00f0ff" class="neon" filter="url(#brilloSuave)"/>
    <!-- Antena -->
    <line x1="179" y1="150" x2="179" y2="125" stroke="#3a1a5a" stroke-width="2"/>
    <circle cx="179" cy="123" r="3" fill="#ff2fb0" class="parpadeo" filter="url(#brilloSuave)"/>

    <!-- Suelo con grilla en perspectiva -->
    <rect y="260" width="1200" height="80" fill="url(#suelo)"/>
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#ff2fb0" stroke-width="2" filter="url(#brilloSuave)"/>
    <g stroke="#b026ff" stroke-width="1" opacity="0.55">
      <line x1="600" y1="260" x2="-600" y2="340"/><line x1="600" y1="260" x2="-200" y2="340"/><line x1="600" y1="260" x2="150" y2="340"/>
      <line x1="600" y1="260" x2="420" y2="340"/><line x1="600" y1="260" x2="600" y2="340"/><line x1="600" y1="260" x2="780" y2="340"/>
      <line x1="600" y1="260" x2="1050" y2="340"/><line x1="600" y1="260" x2="1400" y2="340"/><line x1="600" y1="260" x2="1800" y2="340"/>
    </g>
    <g clip-path="url(#marco)">
      <g class="grilla" stroke="#b026ff" stroke-width="1" opacity="0.5">
        <line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="290" x2="1200" y2="290"/>
        <line x1="0" y1="310" x2="1200" y2="310"/><line x1="0" y1="330" x2="1200" y2="330"/>
      </g>
      <rect y="0" width="1200" height="261" fill="url(#cielo)" opacity="0" />
    </g>

    <!-- Panel HUD -->
    <rect x="300" y="70" width="600" height="170" rx="6" fill="#05010f" opacity="0.55" stroke="#00f0ff" stroke-opacity="0.35"/>
    <g stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#brilloSuave)">
      <path d="M300 92 V70 H322"/><path d="M878 70 H900 V92"/><path d="M300 218 V240 H322"/><path d="M878 240 H900 V218"/>
    </g>

    <text x="320" y="96" class="t" font-size="13" fill="#00f0ff" opacity="0.85">SYS://perfil.cargado  ▸  BUENOS AIRES, AR</text>
    <circle cx="826" cy="91" r="4" fill="#ff2fb0" class="parpadeo" filter="url(#brilloSuave)"/>
    <text x="880" y="96" class="t" font-size="13" fill="#ff2fb0" text-anchor="end" opacity="0.9">ONLINE</text>

    <!-- Título con glitch -->
    <g class="t titulo" text-anchor="middle">
      <text x="600" y="162" fill="#00f0ff" opacity="0.8" class="glitch-c">JEAN ESQUEN</text>
      <text x="600" y="162" fill="#ff2fb0" opacity="0.8" class="glitch-m">JEAN ESQUEN</text>
      <text x="600" y="162" fill="#f4f0ff" class="neon" filter="url(#brilloSuave)">JEAN ESQUEN</text>
    </g>

    <text x="600" y="198" class="t" font-size="18" fill="#f4f0ff" text-anchor="middle" letter-spacing="2">&gt; CIENCIA DE DATOS // ANÁLISIS // DESARROLLO</text>
    <text x="600" y="226" class="t" font-size="12" fill="#b9a6e8" text-anchor="middle" letter-spacing="1">PYTHON · PANDAS · SQL · MATPLOTLIB · C# · .NET</text>

    <!-- Capa de scanlines -->
    <rect width="1200" height="340" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="14" fill="none" stroke="#ff2fb0" stroke-opacity="0.6" stroke-width="2"/>
</svg>
